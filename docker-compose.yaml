
services:
  zookeeper_unit_economics:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper_unit_economics
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka_unit_economics:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka_unit_economics
    depends_on:
      - zookeeper_unit_economics
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_unit_economics:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_unit_economics:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafdrop_unit_economics:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop_unit_economics
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka_unit_economics:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka_unit_economics

  redis:
    image: redis:7
    container_name: redis_unit_economics
    ports:
      - "6379:6379"
    depends_on:
      - kafka_unit_economics